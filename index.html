<!DOCTYPE html>
<!-- This line tells the browser: "Hey, this is a modern HTML5 page" -->

<html lang="en">
    <!-- lang="en" tells the browser (and screen readers) this is in English -->

    <head>
        <!-- HEAD = the brain. Stuff here is NOT visible on the page -->
        <!-- It's settings, metadata, and links to the CSS files -->

        <meta charset="UTF-8">
        <!-- charset = character set. UTF-8 supports all letters/emoji worldwide -->

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- This makes it look right on phones (don't worry about this yet) -->


        <title>Newton's Museum - Photo Gallery</title>
        <!-- This is the text that appears on the browser TAB -->

        <!-- This line connects your CSS file to this HTML file -->
        <link rel="stylesheet" href="css/style.css">

    </head>
    <body>

        <!-- HEADER: the top banner of your gallery -->
        <header>
            <h1>📸 My Photo Gallery</h1>
            <p>A collection of my favorite moments</p>
        </header>

  <!-- MAIN: this is where the photo grid will live (Day 3!) -->
  <main>

    <!-- ADD PHOTO CONTROL PANEL -->
  <div class="controls">

    <h3>Add a Photo</h3>

    <div class="controls-row">

      <input 
        type="text" 
        id="newSrc" 
        placeholder="filename.jpg (just the filename!)">

      <input 
        type="text" 
        id="newCaption" 
        placeholder="Caption for the photo">

      <button onclick="addPhoto()">+ Add Photo</button>

    </div>

    <p class="controls-note">
      💡 Make sure the photo file is already in your images/ folder first!
    </p>

  </div>


    <!-- Gallery is now built by JavaScript from the photos array in gallery.js -->
    <section class="gallery">
      <!-- JavaScript fills this in automatically -->
    </section>
  
  </main>

  <!-- LIGHTBOX: hidden by default, shown by JavaScript when a photo is clicked -->
  <div class="lightbox" id="lightbox">

    <!-- The X button to close -->
    <span class="close-btn" id="closeBtn">&times;</span>

    <!-- This img starts empty — JavaScript fills it in when you click a photo -->
    <img src="" alt="Expanded photo view" id="lightboxImg">

  </div>

  <!-- Link your JavaScript file — ALWAYS at the bottom, just before </body> -->
  <script src="js/gallery.js"></script>

    </body>

</html>
