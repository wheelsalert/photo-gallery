<!DOCTYPE html>
<!-- This line tells the browser: "Hey, this is a modern HTML5 page" -->

<html lang="en">
    <!-- lang="en" tells the browser (and screen readers) this is in English -->

    <head>
        <!-- HEAD = the brain. Stuff here is NOT visible on the page -->
        <!-- It's settings, metadata, and links to the CSS files -->

        <meta charset="UTF-8">
        <!-- charset = character set. UTF-8 supports all letters/emoji worldwide -->

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- This makes it look right on phones (don't worry about this yet) -->


        <title>My Photo Gallery</title>
        <!-- This is the text that appears on the browser TAB -->

        <!-- This line connects your CSS file to this HTML file -->
        <link rel="stylesheet" href="css/style.css">

    </head>
    <body>

        <!-- HEADER: the top banner of your gallery -->
        <header>
            <h1>📸 My Photo Gallery</h1>
            <p>A collection of my favorite moments</p>
        </header>

  <!-- MAIN: this is where the photo grid will live (Day 3!) -->
  <main>
    <p>Photos coming soon...</p>
  </main>

    </body>

</html>
